# GPT disk image for Nexora OS (x86-64), A/B root slots:
#
#   nexora-esp    64 MiB    vfat: GRUB (bootx64.efi), grub.cfg, grubenv
#   nexora-rootA  2048 MiB  ext4 root filesystem, slot A (kernel in /boot)
#   nexora-rootB  2048 MiB  ext4 root filesystem, slot B (same image)
#   nexora-data   1024 MiB  ext4 user data, mounted on /home (empty)
#
# The partition names become the GPT partition names, which the target
# scripts look up (see /usr/libexec/nexora/nexora-functions). The partition
# UUIDs are fixed constants: grub.cfg passes root=PARTUUID=<slot UUID> to
# the kernel. data.ext4 is created by post-image.sh.

image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
	}

	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition nexora-esp {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = 765f38f2-da29-4acd-ab04-4efbb2614933
		offset = 1M
		bootable = true
	}

	partition nexora-rootA {
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = a53a2928-ea7f-47cf-b947-3dcee36d06a2
		image = "rootfs.ext4"
		size = 2048M
	}

	partition nexora-rootB {
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = e2881ee1-cdfe-4037-8671-5b437fd2aad9
		image = "rootfs.ext4"
		size = 2048M
	}

	partition nexora-data {
		partition-type-uuid = 933ac7e1-2eb4-4f13-b844-0e14e2aef915
		partition-uuid = 21b5b662-e48b-45c6-af44-7cd2382e8774
		image = "data.ext4"
		size = 1024M
	}
}
