# Nexora OS GRUB2 (x86_64-efi) configuration: A/B root slots with boot
# counting. Installed to EFI/BOOT/grub.cfg on the EFI system partition.
#
# Disk layout (genimage.cfg), all on the disk GRUB was loaded from:
#   gpt1 nexora-esp    this file, grubenv, bootx64.efi (no kernel)
#   gpt2 nexora-rootA  slot A root filesystem, kernel at /boot/bzImage
#   gpt3 nexora-rootB  slot B root filesystem, kernel at /boot/bzImage
#   gpt4 nexora-data   user data (/home)
#
# grubenv (EFI/BOOT/grubenv, next to this file):
#   nexora_slot   A|B     confirmed slot (default A)
#   nexora_try    A|B|""  slot on trial after an update ("" = none)
#   nexora_tries  3..0    trial boots left
#
# While nexora_try is set, every boot first consumes one try (3 -> 2 ->
# 1 -> 0, saved before the kernel is loaded) and boots nexora_try. With no
# tries left the trial is abandoned (nexora_try cleared) and the confirmed
# slot boots: automatic rollback. nexora-bootok on the target confirms a
# trial slot (nexora_slot=<slot>, nexora_try cleared) once the console UI
# has started. If the counter cannot be saved, the confirmed slot boots, so
# a broken slot can never be retried forever.
#
# grubenv.bak (written by the target after every grubenv update, see
# nexora-functions) is used instead of grubenv when grubenv cannot be
# loaded (e.g. torn by a power cut during a rewrite on vfat); the boot
# counter is then kept in grubenv.bak. Without a usable file the defaults
# below apply (slot A, no trial). The recovery menu can rebuild both.

set default=0
set timeout=3

set nexora_env="${prefix}/grubenv"
set nexora_env_bak="${prefix}/grubenv.bak"
set nexora_slot=A
set nexora_try=
set nexora_tries=0
# Only these three variables are taken from grubenv. load_env fails on a
# damaged (e.g. truncated) environment block without setting anything.
set nexora_env_ok=0
if [ -f "${nexora_env}" ]; then
	if load_env --file "${nexora_env}" nexora_slot nexora_try nexora_tries; then
		set nexora_env_ok=1
	fi
fi
if [ "${nexora_env_ok}" = "0" ]; then
	if [ -f "${nexora_env_bak}" ]; then
		if load_env --file "${nexora_env_bak}" nexora_slot nexora_try nexora_tries; then
			echo "Nexora: grubenv is damaged; using grubenv.bak"
			set nexora_env="${nexora_env_bak}"
		fi
	fi
fi
if [ "${nexora_slot}" != "B" ]; then
	set nexora_slot=A
fi

set nexora_boot="${nexora_slot}"
set nexora_trial=0
if [ "${nexora_try}" = "A" ]; then
	set nexora_trial=1
fi
if [ "${nexora_try}" = "B" ]; then
	set nexora_trial=1
fi
if [ "${nexora_trial}" = "1" ]; then
	if [ "${nexora_tries}" = "3" ]; then
		set nexora_tries=2
	elif [ "${nexora_tries}" = "2" ]; then
		set nexora_tries=1
	elif [ "${nexora_tries}" = "1" ]; then
		set nexora_tries=0
	else
		# Tries used up (or invalid): roll back to the confirmed slot.
		set nexora_trial=0
		set nexora_try=
		set nexora_tries=0
	fi
	if save_env --file "${nexora_env}" nexora_try nexora_tries; then
		if [ "${nexora_trial}" = "1" ]; then
			set nexora_boot="${nexora_try}"
		fi
	else
		echo "Nexora: cannot save the boot counter; booting slot ${nexora_slot}"
	fi
fi

if [ "${nexora_boot}" = "A" ]; then
	set nexora_alt=B
else
	set nexora_alt=A
fi

# The slots are on the same disk as the ESP ("hd0,gpt1" -> "hd0").
set nexora_disk=hd0
regexp --set=1:nexora_disk '^([^,]+),' "${root}"

# Menu entries run in a new context that only sees exported variables.
export nexora_boot
export nexora_alt
export nexora_disk

# nexora_linux SLOT [EXTRA_KERNEL_ARGUMENT]
function nexora_linux {
	if [ "$1" = "B" ]; then
		set root="${nexora_disk},gpt3"
		set nexora_partuuid=e2881ee1-cdfe-4037-8671-5b437fd2aad9
	else
		set root="${nexora_disk},gpt2"
		set nexora_partuuid=a53a2928-ea7f-47cf-b947-3dcee36d06a2
	fi
	echo "Nexora OS: slot $1"
	linux /boot/bzImage root=PARTUUID=${nexora_partuuid} rootwait console=ttyS0,115200 console=tty1 nexora.slot=$1 $2
}

menuentry "Nexora OS" {
	nexora_linux "${nexora_boot}"
}

menuentry "Nexora OS (previous slot)" {
	nexora_linux "${nexora_alt}"
}

menuentry "Nexora OS (recovery menu)" {
	nexora_linux "${nexora_boot}" nexora.recovery
}

menuentry "Nexora OS (maintenance shell: no console UI)" {
	nexora_linux "${nexora_boot}" nexora.noui
}
